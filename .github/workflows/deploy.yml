name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ai-service, backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SERVER_HOST }}
    permissions:
      contents: read
      id-token: write
    env:
      HOST: ${{ vars.SERVER_HOST }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      VM: ${{ vars.AZURE_VM_NAME }}
      APP_DIR: /opt/murder-mystery
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start the VM if it is stopped
        id: vm
        run: |
          state=$(az vm get-instance-view -g "$RG" -n "$VM" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)
          echo "VM state: $state"
          if [[ "$state" == "PowerState/running" ]]; then
            echo "was_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "was_running=false" >> "$GITHUB_OUTPUT"
            az vm start -g "$RG" -n "$VM"
          fi

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          for _ in $(seq 30); do
            ssh -o ConnectTimeout=5 "deploy@$HOST" true && exit 0
            sleep 5
          done
          echo "Server not reachable over SSH" >&2
          exit 1

      - name: Copy compose files
        run: |
          scp docker-compose.yml docker-compose.prod.yml "deploy@$HOST:$APP_DIR/"
          scp -r deploy "deploy@$HOST:$APP_DIR/"

      - name: Pull images and restart
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="sha-${GITHUB_SHA::7}"; fi
          echo "Deploying image tag $TAG"
          ssh "deploy@$HOST" "set -e
            cd $APP_DIR
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/' .env
            $COMPOSE pull --quiet
            $COMPOSE up -d --remove-orphans
            docker image prune -af"

      - name: Health check
        run: curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "https://$HOST/api/health/ready"

      - name: Stop the VM again if it was stopped before
        if: always() && steps.vm.outputs.was_running == 'false'
        run: az vm deallocate -g "$RG" -n "$VM" --no-wait
