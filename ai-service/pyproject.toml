[project]
name = "ai-service"
version = "0.1.0"
description = "Internal stateless AI service: interrogation, case generation, validation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "shared-schemas",
]

[tool.uv.sources]
shared-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
