[project]
name = "shared-schemas"
version = "0.1.0"
description = "Pydantic models shared by backend and ai-service"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
